[metadata]
name = memoflow
version = 1.0.0
description = Memory-Anchored Flow Matching for Joint Trajectory Imputation and Forecasting
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Jiayang Wu

[options]
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.26,<2.0
    pyarrow>=15.0
    scipy>=1.13
    torch>=2.2
    tqdm>=4.66

[options.packages.find]
include =
    models*
    src*
    scripts*

[options.entry_points]
console_scripts =
    memoflow-train = src.train:main
    memoflow-evaluate = src.evaluate:main
    memoflow-baseline = src.baselines:main
    memoflow-audit-av2 = src.audit_av2:main
